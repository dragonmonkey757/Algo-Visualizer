<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>algo-visualizer</title>
    <link rel="stylesheet" href="/node_modules/@pyscript/core/dist/core.css" />
    <link rel="stylesheet" href="/page/mainpage.css" />
    <link rel="stylesheet" href="/page/sidecontent.css" />
    <script type="module" src="/node_modules/@pyscript/core/dist/core.js"></script>

    <py-config>
      interpreter = "/node_modules/pyodide/pyodide.mjs"
      [[fetch]]
      from = "/stepper"
      files = ["stepper.py", "default.py", "firstload.py", "runcont.py", "algos.py"]
    </py-config>
  </head>

  <body>
    <div class="app">
      <div class="toolbar">
        <input id="arrayInput" type="text" value="12, 4, 9, 1, 18, 6, 3" />
        <button id="playBtn">▶ Run</button>
        <select id="selectBtn">↺ Use Async Template</select>
        <button id="pauseBtn" disabled>⏸ Pause</button>
        <button id="resumeBtn" disabled>⏵ Resume</button>
        <button id="stopBtn" disabled>⏹ Stop</button>
      </div>

      <div class="main">
        <section class="panel visualizer-panel">
          <h2>Visualizer</h2>
          <canvas id="chart"></canvas>
          <div id="sidePanel">
            <h3>Step Context</h3>
            <div id="sideElementsContainer"></div>
          </div>
        </section>

        <section class="panel editor-panel">
          <h2>Code Editor</h2>
          <div id="editor"></div>
          <pre id="output"></pre>
        </section>
      </div>
    </div>
    <script type="py" src="/stepper/firstload.py"></script>
    <script type="module" src="/src/ui/buttons.js"></script>
    <script type="module" src="/src/ui/chart.js"></script>
  </body>
</html>
