<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Algorithm Visualizer</title>

    <link rel="stylesheet" href="/pyscript/core.css" />
    <script type="module" src="/pyscript/core.js"></script>

    <py-config>
      packages = ["numpy"]
      [[fetch]]
      from = "/stepper"
      files = ["stepper.py", "default.py", "firstload.py"]
    </py-config>
  </head>

  <body>
    <div class="app">
      <div class="toolbar">
        <input id="arrayInput" type="text" value="12, 4, 9, 1, 18, 6, 3" />
        <button id="playBtn">▶ Run</button>
      </div>

      <div class="main">
        <section class="panel visualizer-panel">
          <h2>Visualizer</h2>
          <canvas id="chart"></canvas>
          <div id="sidePanel">
            <h3>Step Context</h3>
            <div id="sideElementsContainer"></div>
          </div>
        </section>

        <section class="panel editor-panel">
          <h2>Code Editor</h2>
          <div id="editor"></div>
          <pre id="output"></pre>
        </section>
      </div>
    </div>

    <script type="py" src="/stepper/firstload.py"></script>
    <script type="module" src="/src/editor.js"></script>
  </body>
</html>
